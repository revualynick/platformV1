# Staging data services on the Linux box. Bound to 127.0.0.1 only: nothing
# is reachable from the network; you get in through an SSH tunnel.
# Run by box-deploy.sh with project name revualy-staging and staging.env.
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: revualy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in staging.env}
      POSTGRES_DB: revualy_staging
    volumes:
      - ${STAGING_ROOT:?}/data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revualy -d revualy_staging"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in staging.env}
    volumes:
      - ${STAGING_ROOT:?}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
